name: Deploy Testing Branch

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.116.21.238
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "1. Loading nvm"
            export NVM_DIR="/root/.nvm"
            . "$NVM_DIR/nvm.sh"

            set -e

            echo "2. Going to project"
            cd /root/erp_v2

            echo "3. Pulling latest code"
            git pull origin main

            echo "4. Using node"
            nvm use 22.12.0
            node -v
            npm -v

            echo "5. Frontend install"
            cd frontend
            npm install

            echo "6. Frontend build"
            npm run build

            echo "7. Backend install"
            cd ../backend
            npm install

            echo "8. Backend test"
            npm test

            echo "9. Restart pm2"
            pm2 restart erp_v2
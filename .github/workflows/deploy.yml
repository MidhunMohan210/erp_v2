name: Deploy Testing Branch


on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.116.21.238
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
           set -e
            cd /root/erp_v2
            git pull origin main
            source ~/.nvm/nvm.sh
            nvm use 22.12.0
            cd frontend
            npm install
            npm run build
            cd ../backend
            npm install
            npm test
            pm2 restart erp_v2

            
            